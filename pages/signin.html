<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Sign in &mdash; Talent Forge
  </title>
  <link href="../css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar">
   <div class="container nav-inner">
    <a class="brand" href="../index.html">
     Talent
     <span>
      Forge
     </span>
    </a>
    <div class="nav-links">
     <a class="keep" href="signup.html">
      Create account
     </a>
    </div>
   </div>
  </nav>
  <main class="page">
   <div class="container">
    <div class="auth-shell card fade-in">
     <h1 class="card-title">
      Welcome back
     </h1>
     <p class="card-subtitle">
      The form is already structured for the future FastAPI sign-in endpoint.
     </p>
     <form id="signinForm">
      <div class="field">
       <label>
        Email
       </label>
       <input name="email" required="" type="email"/>
      </div>
      <div class="field">
       <label>
        Password
       </label>
       <input name="password" required="" type="password"/>
      </div>
      <button class="btn btn-primary btn-block">
       Sign in
      </button>
     </form>
    </div>
   </div>
  </main>
  <script src="../js/utils.js">
  </script>
  <script src="../js/pages/signin.js">
  </script>
 </body>
</html>
