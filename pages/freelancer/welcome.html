<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Welcome &mdash; Talent Forge
  </title>
  <link href="../../css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar">
   <div class="container nav-inner">
    <a class="brand" href="../../index.html">
     Talent
     <span>
      Forge
     </span>
    </a>
   </div>
  </nav>
  <main class="page" data-step="1">
   <div class="container narrow">
    <div class="step-shell fade-in">
     <div class="step-meta">
      <span data-step-label="">
      </span>
      <span data-progress-pct="">
      </span>
     </div>
     <div class="progress">
      <div class="progress-bar" data-progress-bar="">
      </div>
     </div>
    </div>
    <div class="card fade-in delay-1">
     <div class="eyebrow">
      Your career foundation
     </div>
     <h1 class="card-title">
      Welcome to your Talent Forge profile.
     </h1>
     <p class="card-subtitle">
      You&rsquo;ll complete six short steps. Your answers stay in your browser for now and will later sync through the FastAPI backend.
     </p>
     <div class="grid-3" style="grid-template-columns:1fr 1fr 1fr">
      <div class="feature-card">
       <strong>
        Profile
       </strong>
       <p>
        Personal details
       </p>
      </div>
      <div class="feature-card">
       <strong>
        Evidence
       </strong>
       <p>
        Education &amp; CV
       </p>
      </div>
      <div class="feature-card">
       <strong>
        Direction
       </strong>
       <p>
        Skills &amp; goals
       </p>
      </div>
     </div>
     <div class="form-actions">
      <span>
      </span>
      <a class="btn btn-primary" href="personal-info.html">
       Start step 2 &rarr;
      </a>
     </div>
    </div>
   </div>
  </main>
  <script src="../../js/stepper.js">
  </script>
 </body>
</html>
